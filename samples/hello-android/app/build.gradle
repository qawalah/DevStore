plugins {
    id "com.android.application"
}

android {
    namespace "dev.qawalah.hello"
    compileSdk 35

    defaultConfig {
        applicationId "dev.qawalah.hello"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    // No release signingConfig: DevStore CI signs the APK.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
