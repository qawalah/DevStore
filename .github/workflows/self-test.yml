# Checks DevStore's own pieces on every push: updater tests (Windows
# PowerShell 5.1 and PowerShell 7), Manager tests, and build-only runs of
# both release pipelines against the sample apps. Nothing is published.
name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pester:
    name: Updater tests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Download Pester 5.7.1
        # Always via PowerShell 7: Windows PowerShell 5.1's old PowerShellGet hangs on prompts.
        shell: pwsh
        run: Save-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Path "$env:RUNNER_TEMP\modules" -Force
      - name: Run Pester
        run: |
          Import-Module "$env:RUNNER_TEMP\modules\Pester\5.7.1\Pester.psd1"
          $c = New-PesterConfiguration
          $c.Run.Path = 'windows/agent/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  manager-tests:
    name: Manager tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -v
        working-directory: windows/manager
      - name: Manager imports with tkinter
        working-directory: windows/manager
        run: python -c "import devstore_manager.ui"

  android-build:
    name: Android pipeline (build only)
    uses: ./.github/workflows/android-release.yml
    with:
      working-directory: samples/hello-android
      publish: false

  windows-build:
    name: Windows pipeline (build only)
    strategy:
      fail-fast: false
      matrix:
        dir: [samples/hello-windows-gui, samples/hello-windows-service, samples/hello-windows-go, windows/manager]
    uses: ./.github/workflows/windows-release.yml
    with:
      working-directory: ${{ matrix.dir }}
      publish: false
