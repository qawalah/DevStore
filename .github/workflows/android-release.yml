# Reusable workflow: build, sign and publish an Android APK as a GitHub Release.
# App repos call it from templates/app-repo/.github/workflows/release.yml.
name: DevStore Android release

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder containing gradlew
        type: string
        default: .
      module:
        description: Gradle application module
        type: string
        default: app
      java-version:
        type: string
        default: "17"
      publish:
        description: Create the tag and GitHub Release (false = build check only)
        type: boolean
        default: true
    secrets:
      DEVSTORE_KEYSTORE_B64:
        required: false
      DEVSTORE_KEYSTORE_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Check Android SDK
        run: |
          # GitHub's ubuntu runners ship the Android SDK; AGP downloads any missing platform.
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "::error::Android SDK not found (ANDROID_HOME='${ANDROID_HOME:-}')"
            exit 1
          fi
          echo "Using $ANDROID_HOME with build-tools: $(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEVSTORE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEVSTORE_KEYSTORE_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          KS="$RUNNER_TEMP/devstore.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          elif [ "$PUBLISH" = "true" ]; then
            [ -z "$KEYSTORE_B64" ] && echo "::error::Missing secret DEVSTORE_KEYSTORE_B64 (see DevStore docs/handover/README.md)"
            [ -z "$KEYSTORE_PASSWORD" ] && echo "::error::Missing secret DEVSTORE_KEYSTORE_PASSWORD (see DevStore docs/handover/README.md)"
            exit 1
          else
            echo "Build check only: using a throwaway key."
            PASS="throwaway-$RANDOM$RANDOM"
            keytool -genkeypair -alias devstore -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=DevStore Self-Test" -keystore "$KS" -storepass "$PASS" -keypass "$PASS" >/dev/null
          fi
          echo "::add-mask::$PASS"
          echo "KS=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ":${{ inputs.module }}:assembleRelease"

      - name: Sign APK and read version
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT="${{ inputs.module }}/build/outputs/apk"
          # Prefer the unsigned release APK; otherwise take whatever release APK the
          # build made (e.g. one signed with a debug key). It is re-signed below.
          # `|| true` keeps pipefail from aborting before our own error message.
          UNSIGNED=$(find "$OUT" -path '*release*' -name '*-unsigned.apk' 2>/dev/null | sort | head -1 || true)
          [ -z "$UNSIGNED" ] && UNSIGNED=$(find "$OUT" -path '*release*' -name '*.apk' 2>/dev/null | sort | head -1 || true)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK found under $OUT. Contents: $(find "$OUT" -type f 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "Signing $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/devstore.jks" --ks-key-alias devstore \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          BADGING=$("$BT/aapt2" dump badging "$RUNNER_TEMP/signed.apk" | head -1)
          VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [ -z "$VCODE" ] && { echo "::error::Could not read versionCode"; exit 1; }
          [ -z "$VNAME" ] && VNAME="$VCODE"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "TAG=android-v$VNAME+$VCODE" >> "$GITHUB_ENV"
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          echo "ASSET=$RUNNER_TEMP/$REPO_NAME-$VNAME.apk" >> "$GITHUB_ENV"
          mv "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/$REPO_NAME-$VNAME.apk"
          echo "Built $REPO_NAME $VNAME (versionCode $VCODE)"

      - name: Publish GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already released. Bump versionCode to publish a new version."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
            --title "Android $VNAME" --notes "Built from ${GITHUB_SHA::7} by DevStore."
          echo "::notice::Published $TAG"
