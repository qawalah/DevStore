# DevStore: every push to main builds the app; a bumped version in
# devstore.json publishes a GitHub Release that the DevStore Updater installs
# on the Windows PC.
name: Release

on:
  push:
    branches: [main]
  # Test builds: every pull request from a branch in this repo gets a
  # pre-release you can install before merging; closing the PR deletes them.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qawalah/devstore/.github/workflows/windows-release.yml@main
