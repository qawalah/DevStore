# DevStore: every push to main builds the app; a bumped version in
# devstore.json publishes a GitHub Release that the DevStore Updater installs
# on the Windows PC.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qawalah/devstore/.github/workflows/windows-release.yml@main
