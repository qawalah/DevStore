<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevStore</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7"/><path d="M11 12.5h10l-1 9.5h-8z"/><path d="M13.5 12.5a2.5 2.5 0 0 1 5 0"/></svg>
        <span class="brand-name">DevStore</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <button class="nav-item" data-view="discover" aria-current="page" title="Discover">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
          <span class="label">Discover</span>
        </button>
        <button class="nav-item" data-view="installed" title="Installed">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
          <span class="label">Installed</span><span class="count" id="count-installed"></span>
        </button>
        <button class="nav-item" data-view="shared" title="Shared with you">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9.5" r="2.5"/><path d="M15.5 14.2A4.5 4.5 0 0 1 21 18.5"/></svg>
          <span class="label">Shared</span><span class="count" id="count-shared"></span>
        </button>
        <button class="nav-item" data-view="activity" title="Activity">
          <svg viewBox="0 0 24 24"><path d="M4 12h4l2.5-6 3 12 2.5-6h4"/></svg>
          <span class="label">Activity</span>
        </button>
        <button class="nav-item" data-view="settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></svg>
          <span class="label">Settings</span>
        </button>
      </nav>
      <div class="updater" id="updater">
        <div class="updater-line"><span class="dot" id="updater-dot"></span><span id="updater-title">Checking…</span></div>
        <p class="updater-sub" id="updater-sub"></p>
        <button class="btn btn-quiet btn-block" id="check-now" title="Check for updates">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
          <span class="label">Check for updates</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Discover</h1>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" placeholder="Search your apps" autocomplete="off">
        </label>
      </header>

      <div class="banner" id="banner" hidden></div>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
